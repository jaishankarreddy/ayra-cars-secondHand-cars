<section class="flex min-h-[calc(100vh-80px)] items-center justify-center px-5 py-[60px] max-[600px]:min-h-[calc(100vh-60px)] max-[600px]:px-4 max-[600px]:py-10">
  <div class="w-full max-w-md text-center">
    <div class="icon-wrap mb-6 inline-flex h-[72px] w-[72px] items-center justify-center rounded-[18px] text-[#14272c]">
      <svg lucideClock class="h-10 w-10"></svg>
    </div>
    <h1 class="font-heading text-[clamp(1.75rem,4vw,2.5rem)] font-bold tracking-[-0.03em] text-[#14272c] mb-3">{{ title() }}</h1>
    <p class="mb-8 text-[15px] leading-[1.7] text-[#64748b]">{{ description() }}</p>
    <div class="flex flex-wrap items-center justify-center gap-3">
      <a class="btn-primary inline-flex items-center gap-2 rounded-[10px] bg-[#14272c] px-6 py-3 text-sm font-bold text-white transition-all duration-200 hover:-translate-y-0.5 hover:shadow-[0_6px_20px_rgba(20,39,44,0.25)]" routerLink="/">Go Home <svg lucideArrowRight size="16"></svg></a>
      <a class="inline-flex items-center gap-2 rounded-[10px] border-2 border-[#e2e8f0] bg-transparent px-6 py-3 text-sm font-bold text-[#14272c] transition-colors duration-200 hover:border-[#14272c]" routerLink="/contact">Contact Us</a>
    </div>
  </div>
</section>
