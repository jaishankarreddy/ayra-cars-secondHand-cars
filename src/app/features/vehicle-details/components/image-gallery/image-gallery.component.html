<div class="gallery-container">
  <!-- Main hero image -->
  <div class="gallery-main" (click)="openFullscreen()">
    <img
      [src]="activeImage()"
      [alt]="alt() + ' â€” main image'"
      class="main-img"
      loading="eager"
      decoding="async"
      fetchpriority="high"
      width="800"
      height="600"
    />

    <!-- Verified badge -->
    <div class="verified-badge">
      <svg lucideBadgeCheck size="15"></svg>
      Verified Vehicle
    </div>

    <!-- Nav arrows -->
    <button
      type="button"
      (click)="prev(); $event.stopPropagation()"
      aria-label="Previous image"
      class="nav-arrow nav-prev"
    >
      <svg lucideChevronLeft size="20"></svg>
    </button>
    <button
      type="button"
      (click)="next(); $event.stopPropagation()"
      aria-label="Next image"
      class="nav-arrow nav-next"
    >
      <svg lucideChevronRight size="20"></svg>
    </button>

    <!-- Counter -->
    <div class="image-counter">
      {{ activeIndex() + 1 }} / {{ images().length }}
    </div>

    <!-- Fullscreen button -->
    <button
      type="button"
      (click)="openFullscreen(); $event.stopPropagation()"
      aria-label="Open fullscreen preview"
      class="fullscreen-btn"
    >
      <svg lucideMaximize2 size="17"></svg>
    </button>
  </div>

  <!-- Vertical thumbnails -->
  <div class="gallery-thumbs">
    @for (image of visibleThumbs(); track $index) {
      <button
        type="button"
        class="thumb-item"
        [class.thumb-active]="activeIndex() === $index"
        [attr.aria-label]="'View image ' + ($index + 1)"
        (click)="selectIndex($index)"
      >
        <img
          [src]="image"
          [alt]="alt() + ' â€” image ' + ($index + 1)"
          loading="lazy"
          decoding="async"
          width="160"
          height="120"
        />
      </button>
    }
    <!-- "View all photos" card -->
    @if (remainingCount() > 0) {
      <button
        type="button"
        class="thumb-more-card"
        (click)="openFullscreen()"
        aria-label="View all photos"
      >
        <span class="thumb-more-count">+{{ remainingCount() }}</span>
        <span class="thumb-more-label">View all photos</span>
      </button>
    }
  </div>
</div>

<!-- Fullscreen overlay -->
@if (fullscreen()) {
  <div class="fs-overlay" (click)="closeFullscreen()" role="dialog" aria-modal="true" aria-label="Image preview">
    <!-- Close -->
    <button
      type="button"
      (click)="closeFullscreen()"
      aria-label="Close preview"
      class="fs-btn fs-close"
    >
      <svg lucideX size="24"></svg>
    </button>

    <!-- Image -->
    <div class="fs-content" (click)="$event.stopPropagation()">
      <img
        [src]="activeImage()"
        [alt]="alt() + ' â€” fullscreen'"
        class="fs-img"
        [class.fs-zoomed]="zoomed()"
        (click)="zoomed.set(!zoomed())"
        decoding="async" loading="lazy"
        width="1200"
        height="900"
      />
      <p class="fs-hint">
        Click the image to {{ zoomed() ? 'zoom out' : 'zoom in' }}
      </p>
    </div>

    <!-- Nav -->
    <button
      type="button"
      (click)="prev(); $event.stopPropagation()"
      aria-label="Previous image"
      class="fs-btn fs-nav-prev"
    >
      <svg lucideChevronLeft size="24"></svg>
    </button>
    <button
      type="button"
      (click)="next(); $event.stopPropagation()"
      aria-label="Next image"
      class="fs-btn fs-nav-next"
    >
      <svg lucideChevronRight size="24"></svg>
    </button>

    <!-- Counter -->
    <div class="fs-counter">
      {{ activeIndex() + 1 }} / {{ images().length }}
    </div>
  </div>
}
