<div class="rounded-[16px] border border-[#E2E9E7] bg-white p-6 shadow-[0_8px_28px_rgba(6,47,53,0.08)] sm:p-7">
  <!-- Header -->
  <div class="text-center sm:text-left">
    <span class="inline-flex items-center gap-1.5 rounded-full border border-[#E2E9E7] bg-[#F7FAF9] px-3 py-1 text-[11px] font-bold uppercase tracking-[0.12em] text-[#062F35]">
      <svg lucideShieldCheck class="h-3.5 w-3.5 text-[#15803d]"></svg>
      Secure sign-in
    </span>
    <h1 class="mt-3 font-['Poppins',sans-serif] text-[26px] font-bold leading-tight text-[#062F35] sm:text-[28px]">
      Welcome <span class="bg-gradient-to-r from-[#6B8E1F] via-[#8FBF2A] to-[#B7F23A] bg-clip-text text-transparent">back</span>
    </h1>
    <p class="mt-1 text-[13px] leading-[1.6] text-[#5F7078]">Sign in with your mobile number to continue</p>
  </div>

  <form class="mt-6 space-y-4" (submit)="onSubmit($event)">
    <div class="field-group">
      <label for="login-phone" class="field-label">Mobile Number</label>
      <div class="phone-input-wrap">
        <span class="phone-prefix">+91</span>
        <input
          id="login-phone"
          type="tel"
          class="field-input phone-input"
          placeholder="98445 55308"
          autocomplete="tel"
          maxlength="10"
          [value]="phone()"
          (input)="phone.set($any($event.target).value)"
        />
      </div>
    </div>

    <div class="field-group">
      <div class="flex items-center justify-between">
        <label for="login-password" class="field-label">Password</label>
        <a routerLink="/auth/register" class="text-xs font-semibold text-[#5F7078] hover:text-[#062F35] transition-colors">Forgot?</a>
      </div>
      <div class="relative">
        <svg lucideLock class="field-icon"></svg>
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          class="field-input has-icon pr-12"
          placeholder="••••••••"
          autocomplete="current-password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
        />
        <button
          type="button"
          (click)="showPassword.set(!showPassword())"
          aria-label="Toggle password visibility"
          class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-[#5F7078] transition-colors hover:bg-[#F7FAF9] hover:text-[#062F35]"
        >
          @if (showPassword()) {
            <svg lucideEyeOff class="h-4 w-4"></svg>
          } @else {
            <svg lucideEye class="h-4 w-4"></svg>
          }
        </button>
      </div>
    </div>

    @if (error()) {
      <p class="rounded-[10px] border border-[#FF4D4F]/20 bg-[#FFF1F1] px-4 py-3 text-sm font-medium text-[#C0392B]">
        {{ error() }}
      </p>
    }

    <button
      type="submit"
      appRipple
      [disabled]="loading()"
      class="flex w-full items-center justify-center gap-2 overflow-hidden rounded-[10px] bg-[#062F35] px-6 py-3.5 text-sm font-bold text-white shadow-[0_4px_14px_rgba(6,47,53,0.15)] transition-all duration-200 hover:bg-[#0A3F47] hover:shadow-[0_6px_18px_rgba(6,47,53,0.2)] active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (loading()) {
        <svg lucideLoaderCircle class="h-4 w-4 animate-spin"></svg>
        Signing in…
      } @else {
        Sign In
        <svg lucideArrowRight class="h-4 w-4"></svg>
      }
    </button>

    <div class="flex items-center gap-3">
      <div class="h-px flex-1 bg-[#E2E9E7]"></div>
      <span class="text-xs font-medium text-[#5F7078]">or</span>
      <div class="h-px flex-1 bg-[#E2E9E7]"></div>
    </div>

    <p class="text-center text-sm text-[#5F7078]">
      Don't have an account?
      <a routerLink="/auth/register" class="font-semibold text-[#062F35] underline-offset-4 hover:text-[#6B8E1F] hover:underline transition-colors">
        Create one
      </a>
    </p>
  </form>
</div>
