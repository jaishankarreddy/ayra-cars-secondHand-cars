<section class="py-20 sm:py-28" appReveal>
  <div class="mx-auto w-full px-4 sm:px-0" style="max-width: 1240px;">
    <div class="relative overflow-hidden rounded-[2rem] bg-[#14272c] px-6 py-16 text-center text-white sm:px-12 sm:py-20 lg:py-24">
      <!-- decor -->
      <div class="pointer-events-none absolute -left-24 -top-24 h-72 w-72 rounded-full bg-[#d7fa4c]/25 blur-3xl"></div>
      <div class="pointer-events-none absolute -bottom-24 -right-24 h-72 w-72 rounded-full bg-[#2f454d]/40 blur-3xl"></div>
      <div class="pointer-events-none absolute inset-0 opacity-[0.06]" style="background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0); background-size: 26px 26px;"></div>

      <div class="relative mx-auto max-w-2xl">
        <span class="inline-flex items-center gap-2 rounded-full border border-[#d7fa4c]/30 bg-[#d7fa4c]/10 px-4 py-1.5 text-xs font-semibold uppercase tracking-wider text-[#d7fa4c]">
          <svg lucideCar class="h-4 w-4"></svg>
          Start your journey
        </span>
        <h2 class="mt-5 font-heading text-[30px] font-semibold leading-tight">
          Ready to Find Your <span class="text-[#d7fa4c]">Next Ride</span>?
        </h2>
        <p class="mx-auto mt-5 max-w-xl text-base leading-relaxed text-white/70 sm:text-lg">
          Join hundreds of happy buyers across Karnataka. Browse certified cars and bikes, book a test drive and drive home your dream vehicle today.
        </p>
        <div class="mt-9 flex flex-col items-center justify-center gap-3.5 sm:flex-row">
          <a routerLink="/cars" class="group inline-flex w-full items-center justify-center gap-2 rounded-full bg-[#d7fa4c] px-8 py-4 text-base font-semibold text-[#14272c] transition-all duration-300 hover:-translate-y-0.5 hover:bg-[#c8f23b] hover:shadow-lg sm:w-auto">
            Browse Vehicles
            <svg lucideArrowRight class="h-5 w-5 transition-transform duration-300 group-hover:translate-x-1"></svg>
          </a>
          <a routerLink="/contact" class="inline-flex w-full items-center justify-center gap-2 rounded-full border border-white/25 bg-white/5 px-8 py-4 text-base font-semibold text-white transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/10 sm:w-auto">
            Talk to an expert
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
