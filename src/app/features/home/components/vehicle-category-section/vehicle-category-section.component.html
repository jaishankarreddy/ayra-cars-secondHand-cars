<section class="bg-[#F7F9F8]">
  <div
    class="mx-auto max-w-[1460px]
           px-[72px]
           pt-8
           pb-8
           max-[1024px]:px-10
           max-[768px]:px-5"
  >

    <!-- HEADER -->
    <div class="mb-[27px]">

      <span class="section-eyebrow">Browse by type</span>
      <h2 class="section-title mt-2">
        What are you looking for?
      </h2>

      <p class="section-subtitle mt-2">
        SUVs for highways, hatchbacks for city — plus bikes for traffic.
      </p>

    </div>


    <!-- CATEGORY CARDS -->
    <div
      class="grid
             grid-cols-6
             gap-[14px]
             max-[1400px]:gap-[10px]
             max-[1100px]:grid-cols-3
             max-[768px]:grid-cols-2
             max-[500px]:grid-cols-1"
    >

      <article
        *ngFor="let category of categories"
        (click)="onCategoryClick(category)"
        class="group
               cursor-pointer
               overflow-hidden
               rounded-[14px]
               border
               border-[#E5EAE8]
               bg-white
               shadow-[0_2px_8px_rgba(11,27,42,0.035)]
               transition-all
               duration-300
               hover:-translate-y-[3px]
               hover:shadow-[0_8px_24px_rgba(11,27,42,0.09)]"
      >

        <!-- IMAGE -->
        <div
          class="relative
                 h-[110px]
                 overflow-hidden
                 max-[1400px]:h-[100px]
                 max-[768px]:h-[95px]"
        >

          <img
            [src]="category.image"
            [alt]="category.title"
            class="h-full
                   w-full
                   object-cover
                   transition-transform
                   duration-500
                   group-hover:scale-[1.04]"
          />

        </div>


        <!-- CONTENT -->
        <div
          class="px-[20px]
                 pb-[17px]
                 pt-[14px]
                 max-[768px]:px-[15px]"
        >

          <h3
            class="font-inter
                   text-[17px]
                   font-[500]
                   leading-[1.2]
                   tracking-[-0.02em]
                   text-[#0B1B2A]
                   max-[1400px]:text-[16px]
                   max-[768px]:text-[15px]"
          >
            {{ category.title }}
          </h3>

          <p
            class="mt-[4px]
                   font-inter
                   text-[13px]
                   font-[400]
                   leading-[1.2]
                   text-[#667684]
                   max-[1400px]:text-[12px]
                   max-[768px]:text-[11px]"
          >
            {{ category.description }}
          </p>

        </div>

      </article>

    </div>

  </div>
</section>
