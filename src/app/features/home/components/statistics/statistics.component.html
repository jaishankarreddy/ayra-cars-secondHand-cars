<section class="relative overflow-hidden bg-[#14272c] py-20 text-white sm:py-28" appReveal>
  <div class="container-am relative">
    <div class="mx-auto max-w-2xl text-center">
      <span class="inline-flex items-center gap-2 rounded-full border border-[#d7fa4c]/30 bg-[#d7fa4c]/10 px-3.5 py-1.5 text-xs font-semibold uppercase tracking-wider text-[#d7fa4c]">
        Ayra Cars in numbers
      </span>
      <h2 class="mt-4 font-heading text-[30px] font-semibold">The marketplace Karnataka trusts</h2>
      <p class="mx-auto mt-4 max-w-xl text-sm leading-6 text-white/65 sm:text-base">A clearer way to buy and sell pre-owned cars and bikes across Bangalore and every corner of Karnataka.</p>
    </div>

    <div class="mt-12 grid grid-cols-2 gap-3 sm:grid-cols-4 sm:gap-4">
      @for (stat of stats(); track stat.label) {
        <div class="rounded-2xl border border-white/10 bg-white/[0.06] px-4 py-6 text-center transition-colors hover:border-[#d7fa4c]/35 hover:bg-white/[0.1] sm:px-5 sm:py-7">
          <div class="font-heading text-3xl font-bold text-[#d7fa4c] sm:text-4xl">
            <span>{{ display(stat) }}</span>
          </div>
          <div class="mt-3 text-xs font-semibold uppercase tracking-wider text-white/65 sm:text-sm">{{ stat.label }}</div>
        </div>
      }
    </div>
  </div>
</section>
